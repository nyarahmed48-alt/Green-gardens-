[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Green AI. Must come before the catch-all below, or it would swallow the path
# and answer with index.html.
#
# Site-visit requests are NOT here: they go to Netlify Forms, which intercepts
# the POST to "/" before these rules apply.
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

# Everything else serves the page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
